<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <!-- 外罗盘环 -->
  <circle cx="540" cy="540" r="390" fill="none" stroke="url(#ringGrad)" stroke-width="34"/>
  <!-- 四象限刻度点 -->
  <circle cx="540" cy="96" r="22" fill="#4f46e5"/>
  <circle cx="984" cy="540" r="18" fill="#6366f1"/>
  <circle cx="540" cy="984" r="18" fill="#7c3aed"/>
  <circle cx="96" cy="540" r="18" fill="#6366f1"/>
  <!-- 副四芒星（45度方向） -->
  <polygon points="540,470 765,315 610,540 765,765 540,610 315,765 470,540 315,315" fill="#7c3aed" opacity="0.88"/>
  <!-- 主四芒北极星（正交方向，北向主芒略长象征北极星指引） -->
  <polygon points="540,120 622,458 940,540 622,622 540,940 458,622 140,540 458,458" fill="url(#starGrad)"/>
  <!-- 中心镂空星核环 -->
  <circle cx="540" cy="540" r="68" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.25"/>
